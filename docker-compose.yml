services:
  frontend:
    image: nginx:1.27-alpine
    container_name: devops-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net

  backend:
    build: ./backend
    container_name: devops-backend
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: devopsdb
      DB_USER: devops
      DB_PASSWORD: devopspass
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  database:
    image: mysql:8.4
    container_name: devops-database
    environment:
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

volumes:
  mysql_data:

networks:
  frontend_net:
  backend_net:
