
name: 3-Tier DevOps CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip VPS deployment"
        required: false
        default: false
        type: boolean

# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  APP_NAME: 3-tier-devops-lab

  # Docker Hub
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab

  # VPS
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: ${{ secrets.SSH_USER }}

  # Application
  FRONTEND_PORT: 8080
  BACKEND_PORT: 5000

# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # 1. BUILD AND TEST BACKEND
  # ============================================================

  build-test:

    name: Build and Test Backend

    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # MySQL service for CI testing
    # ----------------------------------------------------------

    services:

      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: devopsdb
          MYSQL_USER: devops
          MYSQL_PASSWORD: devopspass
          MYSQL_ROOT_PASSWORD: rootpass

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:

      run:
        working-directory: backend

    env:

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: devopsdb
      DB_USER: devops
      DB_PASSWORD: devopspass

      PYTHONPATH: .

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout source code
        uses: actions/checkout@v4

      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # INSTALL MYSQL CLIENT
      # ========================================================

      # IMPORTANT:
      # This must happen BEFORE the Wait for MySQL step because
      # mysqladmin is used by that step.

      - name: Install MySQL client
        working-directory: .
        run: |
          echo "Installing MySQL client..."

          sudo apt-get update
          sudo apt-get install -y mysql-client

          mysql --version
          mysqladmin --version

      # ========================================================
      # INSTALL PYTHON DEPENDENCIES
      # ========================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      # ========================================================
      # WAIT FOR MYSQL
      # ========================================================

      - name: Wait for MySQL
        working-directory: .
        run: |

          echo "=========================================="
          echo "WAITING FOR MYSQL"
          echo "=========================================="

          for i in {1..30}; do

            if mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -uroot \
              -prootpass \
              --silent; then

              echo "MySQL is ready."
              exit 0

            fi

            echo "MySQL not ready yet..."
            echo "Attempt: $i/30"

            sleep 2

          done

          echo "ERROR: MySQL did not become ready."

          exit 1

      # ========================================================
      # INITIALIZE DATABASE
      # ========================================================

      - name: Initialize database
        working-directory: .
        run: |

          echo "=========================================="
          echo "INITIALIZING DATABASE"
          echo "=========================================="

          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -uroot \
            -prootpass \
            devopsdb < database/init.sql

          echo "Database initialization completed."

      # ========================================================
      # VERIFY DATABASE CONNECTION
      # ========================================================

      - name: Verify database connection
        run: |

          python - <<'PY'

          import mysql.connector

          print("==========================================")
          print("TESTING MYSQL CONNECTION")
          print("==========================================")

          conn = mysql.connector.connect(
              host="127.0.0.1",
              port=3306,
              database="devopsdb",
              user="devops",
              password="devopspass"
          )

          cursor = conn.cursor()

          cursor.execute("SELECT 1")

          # IMPORTANT:
          # Consume the result before closing the cursor.
          result = cursor.fetchone()

          print("DATABASE CONNECTION: SUCCESS")
          print("Query result:", result)

          cursor.close()
          conn.close()

          print("Database connection test completed successfully.")

          PY

      # ========================================================
      # VERIFY FLASK DATABASE CONNECTION
      # ========================================================

      - name: Verify Flask database connection
        run: |

          python - <<'PY'

          import app

          print("==========================================")
          print("TESTING FLASK DATABASE CONNECTION")
          print("==========================================")

          conn = app.db_connection()

          cursor = conn.cursor()

          cursor.execute("SELECT 1")

          # IMPORTANT:
          # Consume the result before closing the cursor.
          result = cursor.fetchone()

          print("FLASK DATABASE CONNECTION: SUCCESS")
          print("Query result:", result)

          cursor.close()
          conn.close()

          print("Flask database connection test completed successfully.")

          PY

      # ========================================================
      # RUN BACKEND TESTS
      # ========================================================

      - name: Run backend tests
        run: |

          echo "=========================================="
          echo "RUNNING PYTEST"
          echo "=========================================="

          pytest -v

  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  docker-build:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs:
      - build-test

    outputs:

      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout source code
        uses: actions/checkout@v4

      # ========================================================
      # GENERATE IMAGE TAG
      # ========================================================

      - name: Generate image tag
        id: meta
        run: |

          IMAGE_TAG="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          echo "=========================================="
          echo "DOCKER IMAGE TAG"
          echo "=========================================="

          echo "IMAGE_TAG=${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # ========================================================
      # DOCKER BUILDX
      # ========================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # DOCKER HUB LOGIN
      # ========================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # BUILD AND PUSH
      # ========================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v6

        with:

          context: ./backend

          push: true

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================
      # DISPLAY IMAGE
      # ========================================================

      - name: Display image information
        run: |

          echo "=========================================="
          echo "DOCKER IMAGE CREATED"
          echo "=========================================="

          echo "Image:"
          echo "${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab:${{ steps.meta.outputs.image_tag }}"

          echo "=========================================="

  # ============================================================
  # 3. DEPLOY TO VPS
  # ============================================================

  deploy:

    name: Deploy 3-Tier Application to VPS

    runs-on: ubuntu-latest

    needs:
      - docker-build

    # Deploy automatically for push.
    # For manual execution, respect skip_deploy.

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.skip_deploy != true

    env:

      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout source code
        uses: actions/checkout@v4

      # ========================================================
      # SETUP SSH
      # ========================================================

      - name: Setup SSH
        run: |

          echo "=========================================="
          echo "SETTING UP SSH"
          echo "=========================================="

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # ========================================================
      # TEST SSH
      # ========================================================

      - name: Test SSH connection
        run: |

          echo "=========================================="
          echo "TESTING SSH CONNECTION"
          echo "=========================================="

          ssh \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" \
            "echo 'SSH CONNECTION SUCCESSFUL'"

      # ========================================================
      # PREPARE VPS DIRECTORY
      # ========================================================

      - name: Prepare deployment directory
        run: |

          ssh \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << 'EOF'

          set -e

          mkdir -p ~/3-tier-devops-lab/frontend
          mkdir -p ~/3-tier-devops-lab/database

          echo "Deployment directory ready."

          EOF

      # ========================================================
      # COPY DOCKER COMPOSE
      # ========================================================

      - name: Copy docker-compose.yml
        run: |

          scp \
            docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/3-tier-devops-lab/docker-compose.yml"

      # ========================================================
      # COPY NGINX CONFIG
      # ========================================================

      - name: Copy nginx configuration
        run: |

          scp \
            frontend/nginx.conf \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/3-tier-devops-lab/frontend/nginx.conf"

      # ========================================================
      # COPY DATABASE INITIALIZATION
      # ========================================================

      - name: Copy database initialization
        run: |

          scp \
            database/init.sql \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/3-tier-devops-lab/database/init.sql"

      # ========================================================
      # VALIDATE COMPOSE CONFIGURATION
      # ========================================================

      - name: Validate Docker Compose configuration
        run: |

          ssh \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << EOF

          set -e

          cd ~/3-tier-devops-lab

          echo "=========================================="
          echo "CREATING DEPLOYMENT ENVIRONMENT"
          echo "=========================================="

          cat > .env << ENVEOF
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          ENVEOF

          echo "Deployment image:"
          echo "${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab:${{ env.IMAGE_TAG }}"

          echo "=========================================="
          echo "DOCKER COMPOSE VERSION"
          echo "=========================================="

          docker compose version

          echo "=========================================="
          echo "VALIDATING COMPOSE CONFIGURATION"
          echo "=========================================="

          docker compose config

          echo "=========================================="
          echo "COMPOSE CONFIGURATION VALID"
          echo "=========================================="

          EOF

      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy 3-tier application
        run: |

          echo "=========================================="
          echo "DEPLOYING 3-TIER APPLICATION"
          echo "=========================================="

          echo "Application : ${{ env.APP_NAME }}"
          echo "Target Host : ${{ secrets.SERVER_IP }}"
          echo "Image       : ${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab:${{ env.IMAGE_TAG }}"

          ssh \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << EOF

          set -e

          cd ~/3-tier-devops-lab

          echo "=========================================="
          echo "PULLING DOCKER IMAGES"
          echo "=========================================="

          docker compose pull

          echo "=========================================="
          echo "STARTING 3-TIER APPLICATION"
          echo "=========================================="

          docker compose up -d --remove-orphans

          echo "=========================================="
          echo "CONTAINER STATUS"
          echo "=========================================="

          docker compose ps

          EOF

      # ========================================================
      # WAIT FOR SERVICES
      # ========================================================

      - name: Wait for application startup
        run: |

          echo "=========================================="
          echo "WAITING FOR APPLICATION STARTUP"
          echo "=========================================="

          sleep 20

      # ========================================================
      # VERIFY CONTAINERS
      # ========================================================

      - name: Verify container status
        run: |

          ssh \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << 'EOF'

          set +e

          cd ~/3-tier-devops-lab

          echo "=========================================="
          echo "COMPOSE STATUS"
          echo "=========================================="

          docker compose ps

          echo "=========================================="
          echo "BACKEND HEALTH"
          echo "=========================================="

          docker inspect devops-backend \
            --format='Backend health: {{.State.Health.Status}}'

          echo "=========================================="
          echo "DATABASE HEALTH"
          echo "=========================================="

          docker inspect devops-database \
            --format='Database health: {{.State.Health.Status}}'

          echo "=========================================="
          echo "FRONTEND STATUS"
          echo "=========================================="

          docker inspect devops-frontend \
            --format='Frontend status: {{.State.Status}}'

          EOF

      # ========================================================
      # APPLICATION HEALTH CHECK
      # ========================================================

      - name: Application health check
        run: |

          echo "=========================================="
          echo "APPLICATION HEALTH CHECK"
          echo "=========================================="

          for i in {1..12}; do

            echo ""
            echo "Health check attempt $i/12"

            if ssh \
              "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" \
              "curl -fsS --max-time 10 http://localhost:${{ env.FRONTEND_PORT }}/"; then

              echo ""
              echo "=========================================="
              echo "APPLICATION HEALTH CHECK PASSED"
              echo "=========================================="

              exit 0

            fi

            echo "Application not ready yet."

            sleep 10

          done

          echo ""
          echo "=========================================="
          echo "APPLICATION HEALTH CHECK FAILED"
          echo "=========================================="

          exit 1

      # ========================================================
      # DEBUG INFORMATION
      # ========================================================

      - name: Show application logs on failure
        if: failure()
        run: |

          echo "=========================================="
          echo "DEPLOYMENT DEBUG INFORMATION"
          echo "=========================================="

          ssh \
            "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << 'EOF' || true

          cd ~/3-tier-devops-lab

          echo "=========================================="
          echo "COMPOSE STATUS"
          echo "=========================================="

          docker compose ps

          echo "=========================================="
          echo "BACKEND LOGS"
          echo "=========================================="

          docker logs --tail 100 devops-backend || true

          echo "=========================================="
          echo "DATABASE LOGS"
          echo "=========================================="

          docker logs --tail 100 devops-database || true

          echo "=========================================="
          echo "FRONTEND LOGS"
          echo "=========================================="

          docker logs --tail 100 devops-frontend || true

          echo "=========================================="
          echo "BACKEND ENVIRONMENT"
          echo "=========================================="

          docker inspect devops-backend \
            --format='{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^DB_' || true

          EOF

      # ========================================================
      # SUCCESS
      # ========================================================

      - name: Deployment successful
        if: success()
        run: |

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Application : ${{ env.APP_NAME }}"
          echo "Image       : ${{ secrets.DOCKER_USERNAME }}/3-tier-devops-lab:${{ env.IMAGE_TAG }}"
          echo "Frontend    : http://${{ secrets.SERVER_IP }}:${{ env.FRONTEND_PORT }}"

          echo ""
          echo "Architecture:"
          echo "  Nginx    -> Backend"
          echo "  Backend  -> MySQL"
          echo "  MySQL    -> Persistent Volume"

          echo ""
          echo "=========================================="
